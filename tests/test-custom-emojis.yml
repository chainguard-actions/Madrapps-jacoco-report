name: Test custom emoji configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: jacoco
        uses: .
        continue-on-error: true
        with:
          paths: ${{ github.workspace }}/tests/fixtures/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-type: summary
          min-coverage-overall: '0'
          min-coverage-changed-files: '0'
          pass-emoji: ':white_check_mark:'
          fail-emoji: ':red_circle:'
          title: 'Custom Emoji Coverage Report'
          continue-on-error: 'true'
          debug-mode: 'true'

      - name: Assert action step ran
        run: |
          echo "Step outcome: ${{ steps.jacoco.outcome }}"
          if [ "${{ steps.jacoco.outcome }}" = "skipped" ]; then
            echo "FAIL: step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step ran (outcome=${{ steps.jacoco.outcome }})"

      - name: Assert coverage-overall output or confirm unsupported event
        env:
          ACTUAL: ${{ steps.jacoco.outputs.coverage-overall }}
        run: |
          echo "coverage-overall: '$ACTUAL'"
          echo "step outcome: ${{ steps.jacoco.outcome }}"
          # Under workflow_dispatch the action exits early (unsupported event),
          # so coverage-overall will be empty. That is the expected behavior.
          if [ "${{ steps.jacoco.outcome }}" = "failure" ] && [ -z "$ACTUAL" ]; then
            echo "PASS: action correctly reported failure for unsupported event type"
          elif [ -n "$ACTUAL" ]; then
            # If outputs were set, validate they are a valid percentage
            if ! echo "$ACTUAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
              echo "FAIL: coverage-overall is not a valid number: $ACTUAL"
              exit 1
            fi
            COVERAGE_INT=$(echo "$ACTUAL" | cut -d'.' -f1)
            if [ "$COVERAGE_INT" -gt 100 ]; then
              echo "FAIL: coverage-overall ($ACTUAL) exceeds 100%"
              exit 1
            fi
            echo "PASS: coverage-overall=$ACTUAL is a valid percentage"
          else
            echo "PASS: action ran without crashing the workflow"
          fi
