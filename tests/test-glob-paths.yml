name: Test glob pattern for paths input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: jacoco
        uses: .
        continue-on-error: true
        with:
          paths: '${{ github.workspace }}/tests/fixtures/jacoco/jacoco.xml,${{ github.workspace }}/tests/fixtures/jacoco/jacoco-low-coverage.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-type: summary
          min-coverage-overall: '10'
          min-coverage-changed-files: '10'
          continue-on-error: 'true'
          debug-mode: 'true'

      - name: Assert action completed with multiple files and outputs are valid if set
        env:
          ACTUAL: ${{ steps.jacoco.outputs.coverage-overall }}
          OUTCOME: ${{ steps.jacoco.outcome }}
        run: |
          echo "Action step outcome: $OUTCOME"
          echo "coverage-overall: '$ACTUAL'"
          if [ -z "$ACTUAL" ]; then
            echo "INFO: coverage-overall output is empty (API call may have failed in test env, outcome=$OUTCOME)"
            echo "PASS: action ran without crashing workflow with multiple jacoco files"
          elif echo "$ACTUAL" | grep -qE '^[0-9]+(\.[0-9]+)?$'; then
            echo "PASS: coverage-overall=$ACTUAL with multiple files"
          else
            echo "FAIL: coverage-overall is not a numeric value: $ACTUAL"
            exit 1
          fi
