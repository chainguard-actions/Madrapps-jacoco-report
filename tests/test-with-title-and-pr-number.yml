name: Test with title and pr-number inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/42/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          paths: ${{ github.workspace }}/actions/hardened/Madrapps--jacoco-report/v1.7.2-beta/tests/fixtures/jacoco.xml
          token: fake-token-for-testing
          title: 'Coverage Report'
          pr-number: '42'
          comment-type: summary
          min-coverage-overall: '0'
          min-coverage-changed-files: '0'
          update-comment: 'false'
          continue-on-error: 'true'
      - name: Assert coverage-overall output is set
        env:
          ACTUAL: ${{ steps.action.outputs.coverage-overall }}
        run: |
          echo "coverage-overall: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: coverage-overall output was empty"
            exit 1
          fi
          echo "PASS"
